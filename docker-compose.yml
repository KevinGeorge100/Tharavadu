services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/tharavadu.db
      GRAPH_BACKEND: local
      AI_PROVIDER: offline
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tharavadu_data:/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tharavadu_data:
